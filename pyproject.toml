[project]
name = "cfa-tier1-agent-system"
version = "0.1.0"
description = "Local CFA Tier 1 mistake system with skills, CLI, memory, and OpenAI Agents SDK scaffolding."
requires-python = ">=3.11"
dependencies = [
  "openai-agents>=0.2.0",
  "PyJWT[crypto]>=2.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = [
  ".system/tests",
  "apps/api/tests",
  "packages/exam-core/tests",
]
pythonpath = [
  ".",
  ".system",
  "apps/api",
  "packages/exam-core/src",
  "packages/study-science/src",
  "packages/agent-runtime/src",
]
