[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowledge-ingestion"
version = "0.1.0"
description = "PDF knowledge extraction pipeline for OpenExam"
requires-python = ">=3.11"
dependencies = [
    "pymupdf4llm>=0.0.10",
    "pymupdf>=1.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_ingestion"]
