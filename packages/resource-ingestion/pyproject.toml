[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resource-ingestion"
version = "0.1.0"
description = "Policy-guarded local resource ingestion kernel for OpenExam."
requires-python = ">=3.11"
dependencies = [
  "defusedxml>=0.7.1",
  "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["src"]
