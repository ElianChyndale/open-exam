[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "language-science"
version = "0.1.0"
description = "Deterministic context-first language learning algorithms for OpenExam."
requires-python = ">=3.11"
dependencies = [
    "fsrs>=6.0.0,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[tool.setuptools.packages.find]
where = ["src"]
