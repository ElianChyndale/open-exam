<svg width="1600" height="520" viewBox="0 0 1600 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">OpenExam hero banner</title>
  <desc id="desc">A dark editorial banner with the OpenExam name, subtitle, and architecture callouts.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="32" x2="1480" y2="476" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08111f"/>
      <stop offset="0.45" stop-color="#0d1d33"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="144" y1="88" x2="1452" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee"/>
      <stop offset="0.48" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0f172a" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0.96"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1600" height="520" rx="36" fill="url(#bg)"/>
  <circle cx="1330" cy="120" r="190" fill="#22d3ee" fill-opacity="0.08"/>
  <circle cx="250" cy="416" r="220" fill="#8b5cf6" fill-opacity="0.08"/>
  <circle cx="1210" cy="392" r="150" fill="#60a5fa" fill-opacity="0.08"/>
  <rect x="56" y="54" width="1488" height="412" rx="30" fill="url(#card)" stroke="#334155" stroke-opacity="0.6"/>
  <path d="M72 110C244 54 382 42 538 42C791 42 951 114 1138 114C1314 114 1420 84 1528 58V104C1426 130 1318 160 1140 160C944 160 779 88 536 88C386 88 245 102 72 154V110Z" fill="url(#accent)" fill-opacity="0.08"/>

  <text x="112" y="170" fill="#93c5fd" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" letter-spacing="3.8">OPENEXAM</text>
  <text x="112" y="240" fill="#f8fafc" font-size="62" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">Local-first exam OS</text>
  <text x="112" y="292" fill="#cbd5e1" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif">FastAPI backend, Next.js cockpit, and a knowledge-memory loop built for CFA Level I.</text>
  <text x="112" y="332" fill="#cbd5e1" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif">Every attempt becomes diagnosis, scheduling, and review fuel.</text>

  <g filter="url(#shadow)">
    <rect x="112" y="378" width="168" height="48" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.6"/>
    <text x="136" y="408" fill="#e2e8f0" font-size="18" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">FastAPI</text>
    <rect x="292" y="378" width="176" height="48" rx="16" fill="#0f172a" stroke="#818cf8" stroke-opacity="0.6"/>
    <text x="316" y="408" fill="#e2e8f0" font-size="18" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">Next.js cockpit</text>
    <rect x="480" y="378" width="214" height="48" rx="16" fill="#0f172a" stroke="#22c55e" stroke-opacity="0.55"/>
    <text x="504" y="408" fill="#e2e8f0" font-size="18" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">Knowledge memory</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="992" y="110" width="430" height="280" rx="24" fill="#050816" stroke="#1e293b"/>
    <text x="1030" y="154" fill="#f8fafc" font-size="22" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">Study loop</text>
    <text x="1030" y="188" fill="#94a3b8" font-size="16" font-family="Inter, Segoe UI, Arial, sans-serif">Attempt - Diagnose - Review - Repeat</text>
    <g>
      <rect x="1030" y="226" width="132" height="110" rx="20" fill="#0f172a" stroke="#334155"/>
      <text x="1050" y="258" fill="#67e8f9" font-size="16" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">Attempt</text>
      <text x="1050" y="286" fill="#cbd5e1" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif">Questions, notes,</text>
      <text x="1050" y="306" fill="#cbd5e1" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif">timing, confidence</text>
    </g>
    <g>
      <rect x="1178" y="226" width="132" height="110" rx="20" fill="#0f172a" stroke="#334155"/>
      <text x="1198" y="258" fill="#c4b5fd" font-size="16" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">Diagnose</text>
      <text x="1198" y="286" fill="#cbd5e1" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif">Error patterns,</text>
      <text x="1198" y="306" fill="#cbd5e1" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif">topic weakness</text>
    </g>
    <g>
      <rect x="1326" y="226" width="132" height="110" rx="20" fill="#0f172a" stroke="#334155"/>
      <text x="1346" y="258" fill="#86efac" font-size="16" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">Review</text>
      <text x="1346" y="286" fill="#cbd5e1" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif">Spacing, recall,</text>
      <text x="1346" y="306" fill="#cbd5e1" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif">retention</text>
    </g>
  </g>
</svg>
