<svg width="1600" height="420" viewBox="0 0 1600 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">OpenExam architecture</title>
  <desc id="desc">A layered architecture diagram showing the web cockpit, API services, and local storage layers.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0b1220"/>
      <stop offset="1" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="top" x1="180" y1="82" x2="1420" y2="82">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="mid" x1="180" y1="206" x2="1420" y2="206">
      <stop stop-color="#22c55e"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="bot" x1="180" y1="318" x2="1420" y2="318">
      <stop stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="420" rx="34" fill="url(#panel)"/>
  <rect x="32" y="28" width="1536" height="364" rx="28" fill="#08111f" stroke="#1f2a44"/>
  <text x="80" y="78" fill="#f8fafc" font-size="26" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">System architecture</text>
  <text x="80" y="108" fill="#94a3b8" font-size="16" font-family="Inter, Segoe UI, Arial, sans-serif">A local-first stack that keeps study evidence, review logic, and planning on your machine.</text>

  <rect x="110" y="136" width="1380" height="78" rx="20" fill="#0f172a" stroke="#334155"/>
  <rect x="110" y="250" width="1380" height="78" rx="20" fill="#0f172a" stroke="#334155"/>
  <rect x="110" y="330" width="1380" height="52" rx="16" fill="#0f172a" stroke="#334155"/>

  <text x="144" y="175" fill="#67e8f9" font-size="18" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">Web cockpit</text>
  <text x="144" y="199" fill="#cbd5e1" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif">Today / Review / Mock / LanguageOS / ResourceOS</text>
  <text x="144" y="289" fill="#86efac" font-size="18" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">API services</text>
  <text x="144" y="313" fill="#cbd5e1" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif">Attempt capture, diagnosis, review scheduling, analytics, exports</text>
  <text x="144" y="364" fill="#fdba74" font-size="16" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">Local evidence store</text>

  <g>
    <rect x="650" y="148" width="220" height="48" rx="14" fill="#0b1020" stroke="#38bdf8"/>
    <text x="680" y="178" fill="#e2e8f0" font-size="16" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">Next.js cockpit</text>
    <rect x="650" y="262" width="220" height="48" rx="14" fill="#0b1020" stroke="#22c55e"/>
    <text x="680" y="292" fill="#e2e8f0" font-size="16" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">FastAPI / CLI layer</text>
    <rect x="650" y="336" width="220" height="28" rx="12" fill="#0b1020" stroke="#f59e0b"/>
    <text x="678" y="355" fill="#e2e8f0" font-size="14" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">JSONL, markdown, FTS5</text>
  </g>

  <g>
    <rect x="930" y="148" width="220" height="48" rx="14" fill="#0b1020" stroke="#38bdf8"/>
    <text x="962" y="178" fill="#e2e8f0" font-size="16" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">Study dashboard</text>
    <rect x="930" y="262" width="220" height="48" rx="14" fill="#0b1020" stroke="#22c55e"/>
    <text x="962" y="292" fill="#e2e8f0" font-size="16" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">Review engine</text>
    <rect x="930" y="336" width="220" height="28" rx="12" fill="#0b1020" stroke="#f59e0b"/>
    <text x="956" y="355" fill="#e2e8f0" font-size="14" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">Knowledge memory</text>
  </g>

  <g>
    <rect x="1210" y="148" width="220" height="48" rx="14" fill="#0b1020" stroke="#38bdf8"/>
    <text x="1244" y="178" fill="#e2e8f0" font-size="16" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">Human workflow</text>
    <rect x="1210" y="262" width="220" height="48" rx="14" fill="#0b1020" stroke="#22c55e"/>
    <text x="1246" y="292" fill="#e2e8f0" font-size="16" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">Progress feedback</text>
    <rect x="1210" y="336" width="220" height="28" rx="12" fill="#0b1020" stroke="#f59e0b"/>
    <text x="1240" y="355" fill="#e2e8f0" font-size="14" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">Study plans and mock retros</text>
  </g>

  <path d="M870 196H930" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <path d="M1150 196H1210" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <path d="M870 310H930" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
  <path d="M1150 310H1210" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
</svg>
