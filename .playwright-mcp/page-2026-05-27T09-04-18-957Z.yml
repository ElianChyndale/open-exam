        - generic [ref=e79]: Recommended Module
        - heading "Module 新结构" [level=2] [ref=e80]
        - paragraph [ref=e81]: Module 页应该像一章“教材驱动的考试笔记”：先讲懂，再翻译成会做题的动作。删除机械的补强表格，把它们融入每个知识点段落。
        - list [ref=e82]:
          - listitem [ref=e83]: 每个教材小节变成一个知识块，而不是挂在末尾。
          - listitem [ref=e84]: 每个知识块固定包含：中文解释、English term、公式或判断规则、题干触发词、常见陷阱。
          - listitem [ref=e85]: 基础题和 mock 不独立漂浮，回填到对应知识块的 “Practice Evidence”。
