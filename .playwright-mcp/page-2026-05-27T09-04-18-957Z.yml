        - heading "MOC 新结构" [level=2] [ref=e62]
        - paragraph [ref=e63]: MOC 应该是“科目地图”，不是正文仓库。它负责告诉你每个 Module 在教材、考试、题库、错题闭环中的位置。
        - list [ref=e64]:
          - listitem [ref=e65]: 保留官方模块导航，但把“教材锚点表”改成可读的 subject map。
          - listitem [ref=e66]: 每个 Module 一行包含：教材章节、核心任务、最高频题型、连接到题库和 mock。
          - listitem [ref=e67]: 新增一页级别的 study route：先学什么、哪些模块一起复盘、哪些跨科目接口要连。
